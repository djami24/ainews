name: AI News Bot

on:
  schedule:
    # Har 30 daqiqada ishga tushadi (GitHub bepul cron uchun kafolatlangan
    # minimal aniqlik ~ 5-15 daqiqa kechikish bo'lishi mumkin, bu normal holat)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # "Run workflow" tugmasi orqali qo'lda ham ishga tushirish mumkin

permissions:
  contents: write  # seen.json faylini repo'ga qaytarib commit qilish uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: seen.json o'zgarishlarini saqlash
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Yangi postlar belgilandi"
          git push
